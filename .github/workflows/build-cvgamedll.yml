name: Build CvGameCoreDLL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-vs2003:
    name: VS2003 Win32 DLL
    runs-on: [self-hosted, Windows, vs2003]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Build Final Release
        run: scripts\build_vs2003.bat "Final Release|Win32"

      - name: Upload CvGameCoreDLL
        uses: actions/upload-artifact@v4
        with:
          name: CvGameCoreDLL-win32
          path: artifacts/CvGameCoreDLL.dll
          if-no-files-found: error
